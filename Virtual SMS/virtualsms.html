<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual SMS 🌐</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="theme-virtual">
    <div id="appView" class="container">
        
        <!-- TOP ACTIONS BAR (1 BARIS PENUH) -->
        <div class="top-bar-modern">
            <div class="app-tabs">
                <a href="#" class="app-tab"><i class="fas fa-bolt"></i> Hero</a>
                <a href="#" class="app-tab active"><i class="fas fa-globe"></i> Virtual</a>
            </div>
            <div class="action-icons">
                <button onclick="openStatsModal()" class="btn-switch-sm"><i class="fas fa-chart-bar"></i></button>
                <button onclick="openBlacklistModal()" class="btn-switch-sm"><i class="fas fa-ban"></i><span id="blacklistBadge" class="badge">0</span></button>
                <button onclick="openHistoryModal()" class="btn-switch-sm"><i class="fas fa-history"></i></button>
                <button onclick="document.getElementById('btnOpenNotes').click()" class="btn-switch-sm"><i class="fas fa-sticky-note"></i></button>
                <button id="btnOpenNotes" class="hidden"></button>
                <button onclick="openSettingsModal()" class="btn-switch-sm"><i class="fas fa-cog"></i></button>
            </div>
        </div>

        <!-- HEADER TITLE -->
        <div class="app-header-container">
            <div class="header-titles">
                <h1>Virtual SMS 🌐</h1>
                <p class="subtitle">👨‍💻 Akun: <strong id="currentAccountName">Memuat...</strong></p>
            </div>
        </div>
        
        <div class="section" style="margin-bottom: 5px;">
            <div id="activeOrdersContainer">
                <div class="status-text">Belum ada pesanan aktif.</div>
            </div>
        </div>

        <div class="balance-container">
            <div class="balance-badge">
                <span class="balance-label">Saldo</span>
                <span id="balanceDisplay" class="balance-value">...</span>
            </div>
        </div>

        <div class="section">
            <!-- HEADER OPERATOR DAN CHECKLIST ACAK -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div style="font-size: 10px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;">Pilih Operator:</div>
                <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--primary-color); cursor: pointer; background: var(--bg-card); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <input type="checkbox" id="chkRandomOp" onchange="toggleRandomOperator()" checked style="accent-color: var(--primary-color);"> Acak 
                    <span id="randomPriceBadge" style="background: var(--bg-body); padding: 2px 6px; border-radius: 4px; font-size: 9px; box-shadow: inset 0 0 4px rgba(0,0,0,0.3); color: var(--text-primary);">...</span>
                </label>
            </div>

            <!-- GRID OPERATOR (Tanpa Acak) -->
            <div id="productList" class="product-list">
                <div class="status-text">Memuat data Server...</div>
            </div>
            
            <button id="btnOrder" class="btn-primary" disabled>Pesan Nomor Baru</button>
            <div id="extraBtnWrapper"></div>
        </div>
    </div>

    <!-- MODAL SETTINGS (Ditambahkan API Key) -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">⚙️ Pengaturan</h3>
                <button onclick="closeSettingsModal()" class="btn-danger" style="width: 32px; height: 32px; padding: 0; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;"><i class="fas fa-times"></i></button>
            </div>
            <div style="text-align: left; margin-bottom: 12px;">
                <label style="font-size: 13px; font-weight: bold; color: var(--text-secondary); margin-bottom: 8px; display: block;">API Key (Manual)</label>
                <input type="text" id="settingsApiKey" class="form-input" placeholder="Masukkan API Key...">
            </div>
            <div style="text-align: left; margin-bottom: 15px;">
                <label style="font-size: 13px; font-weight: bold; color: var(--text-secondary); margin-bottom: 8px; display: block;">Sandi Default (Salin Otomatis)</label>
                <input type="text" id="settingsPassword" class="form-input" placeholder="Masukkan sandi...">
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
                <span style="font-size: 13px; font-weight: bold; color: var(--text-primary);">Auto-Salin Sandi Selesai</span>
                <label class="switch">
                    <input type="checkbox" id="settingsAutoCopy">
                    <span class="slider"><span class="slider-knob"></span></span>
                </label>
            </div>
            <button onclick="saveSettings()" class="btn-success" style="width: 100%; padding: 14px; border-radius: 12px; font-size: 15px;"><i class="fas fa-save"></i> Simpan Pengaturan</button>
        </div>
    </div>

    <!-- MODAL STATISTIK (Sama persis, digabung logikanya) -->
    <div id="statsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Statistik Harian</h3>
                <button onclick="closeStatsModal()" class="btn-danger" style="width: 32px; height: 32px; padding: 0; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;"><i class="fas fa-times"></i></button>
            </div>
            <input type="date" id="statDate" class="form-input" style="margin-bottom:15px; font-weight:bold; text-align:center; color: var(--text-primary); background: var(--bg-card); border: 1px solid var(--border-color);">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div style="background: rgba(46, 204, 113, 0.1); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--success-color);">
                    <div style="font-size: 24px; font-weight: 900; color: var(--success-color);" id="statSuccess">0</div>
                    <div style="font-size: 10px; font-weight: bold; color: var(--text-secondary); text-transform: uppercase;">Sukses OTP</div>
                </div>
                <div style="background: rgba(231, 76, 60, 0.1); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--danger-color);">
                    <div style="font-size: 24px; font-weight: 900; color: var(--danger-color);" id="statFailed">0</div>
                    <div style="font-size: 10px; font-weight: bold; color: var(--text-secondary); text-transform: uppercase;">Batal / Ganti</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sisa Modal (Blacklist, History, Notes, Form Notes) persis sama strukturnya, logika di JS yang mengatur integrasi. -->
    <!-- (Untuk menjaga performa dan efisiensi diskusi, sisa modal HTML dari HeroSMS diletakkan identik di sini. Struktur mengikuti kode Anda sebelumnya.) -->
    <div id="toast" class="toast">Notifikasi!</div>

    <script src="script.js"></script>
</body>
</html>
