<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Cepat ⚡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="otpcepat.css">
    
    <!-- SCRIPT PELACAK MEMORI YANG SUDAH DIPERBAIKI (ANTI-LONCAT APLIKASI) -->
    <script>
        (function() {
            var currentHref = window.location.href;
            if (currentHref.includes('virtualsms.html')) localStorage.setItem('last_active_app', 'virtualsms.html');
            else if (currentHref.includes('herosms.html')) localStorage.setItem('last_active_app', 'herosms.html');
            else if (currentHref.includes('smscode.html')) localStorage.setItem('last_active_app', 'smscode.html');
            else if (currentHref.includes('otpcepat.html')) localStorage.setItem('last_active_app', 'otpcepat.html');
            // Logika auto-redirect sudah dihapus sepenuhnya agar tab tidak memuat ulang ke aplikasi lain saat bangun dari background.
        })();
    </script>

    <style>
        .app-dropdown-menu { display: none; position: absolute; background-color: var(--bg-card); min-width: 170px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5); z-index: 999; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; top: 44px; left: 0; }
        .app-dropdown-menu.show { display: block; animation: fadeIn 0.2s ease; }
        .app-dropdown-item { color: var(--text-primary); padding: 12px 14px; text-decoration: none; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-color); font-size: 13px; font-weight: 700; transition: 0.2s; }
        .app-dropdown-item:last-child { border-bottom: none; }
        .app-dropdown-item:hover { background-color: var(--bg-card-hover); color: var(--primary-color); }
        .app-dropdown-item.active { color: var(--primary-color); background-color: var(--bg-body); }
        .app-dropdown-item i { width: 16px; text-align: center; }
    </style>
</head>
<body class="theme-otp">
    <div id="appView" class="container">
        
        <div class="top-bar-modern">
            <div style="display: flex; gap: 8px; align-items: center;">
                <div class="dropdown">
                    <button class="dropbtn" onclick="toggleAppDropdown()">
                        <i class="fas fa-rocket"></i> OTP Cepat <i class="fas fa-caret-down" style="font-size: 10px; margin-left: 2px;"></i>
                    </button>
                    <div id="appDropdown" class="dropdown-content">
                        <a href="https://shopee-smscode.github.io/Virtual%20SMS/virtualsms.html" class="app-dropdown-item" onclick="localStorage.setItem('last_active_app', 'virtualsms.html');"><i class="fas fa-globe"></i> SMS Virtual</a>
                        <a href="https://shopee-smscode.github.io/Hero%20SMS/herosms.html" class="app-dropdown-item" onclick="localStorage.setItem('last_active_app', 'herosms.html');"><i class="fas fa-bolt"></i> Hero SMS</a>
                        <a href="https://shopee-smscode.github.io/SMS%20Code/smscode.html" class="app-dropdown-item" onclick="localStorage.setItem('last_active_app', 'smscode.html');"><i class="fas fa-sms"></i> SMS Code</a>
                        <a href="https://shopee-smscode.github.io/OTP%20Cepat/otpcepat.html" class="app-dropdown-item active" onclick="localStorage.setItem('last_active_app', 'otpcepat.html');"><i class="fas fa-rocket"></i> OTP Cepat</a>
                    </div>
                </div>
                <button onclick="openIframeNoteModal()" class="btn-top-action"><i class="fas fa-sticky-note"></i></button>
            </div>
            
            <div style="display: flex; gap: 8px; align-items: center;">
                <button onclick="window.open('https://otpcepat.org/topup', '_blank')" class="dropbtn-icon" style="color: var(--success-color); border-color: var(--success-color);" title="Top Up Saldo">
                    <i class="fas fa-plus-circle"></i>
                </button>
                <div class="dropdown">
                    <button class="dropbtn-icon" onclick="toggleMenuDropdown()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div id="menuDropdown" class="dropdown-content dropdown-right">
                        <a href="#" onclick="openHistoryModal(); return false;"><i class="fas fa-history"></i> Riwayat</a>
                        <a href="#" onclick="openSettingsModal(); return false;"><i class="fas fa-cog"></i> Pengaturan</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-header-container">
            <div class="header-titles">
                <h1>OTP CEPAT ⚡</h1>
                <p class="subtitle">📧 Akun: <strong id="currentAccountEmail">Belum Login</strong></p>
            </div>
            <div class="balance-container">
                <div class="balance-badge">
                    <span class="balance-label">Saldo (Rp)</span>
                    <span id="balanceDisplay" class="balance-value">...</span>
                </div>
            </div>
        </div>
        
        <div id="activeOrdersContainer">
            <div class="status-text-mini">Belum ada pesanan aktif.</div>
        </div>

        <div style="margin-top: 24px;">
            <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-bottom: 12px;">
                <div style="flex: 1; text-align: left; min-width: 0;">
                    <label style="font-size: 11px; font-weight: 900; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; padding-left: 4px;">Layanan</label>
                    <button onclick="openServiceModal()" class="form-input" style="text-align: left; font-weight: 800; font-size: 13px; padding: 10px 12px; border-radius: 10px; background-color: var(--bg-card); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); color: var(--primary-color); height: 36px; margin: 0;">
                        <span id="btnServiceSelectText" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Memuat...</span>
                        <i class="fas fa-search" style="font-size: 11px; flex-shrink: 0; margin-left: 5px;"></i>
                    </button>
                </div>
                <div style="flex-shrink: 0; text-align: left;">
                    <label style="font-size: 11px; font-weight: 900; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; padding-left: 4px; text-align: center;">Harga</label>
                    <div id="priceDisplayBox" style="display: flex; align-items: center; justify-content: center; height: 36px; padding: 0 10px; font-weight: 900; font-size: 13px; border-radius: 10px; border: 1px solid var(--border-color); color: var(--success-color); background-color: var(--bg-card); margin: 0; white-space: nowrap;">
                        ...
                    </div>
                </div>
                <div style="flex-shrink: 0;">
                    <label style="font-size: 11px; font-weight: 900; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; text-align: center;">Kategori</label>
                    <select id="categorySelect" onchange="onCategoryChanged()" class="form-input" style="height: 36px; padding: 0 5px; font-weight: 900; font-size: 12px; border-radius: 10px; border: 1px solid var(--border-color); color: var(--primary-color); background-color: var(--bg-card); cursor: pointer; width: 125px; margin: 0; outline: none; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;">
                        <option value="promo">🔥 PROMO</option>
                        <option value="prioritas">⭐ PRIORITAS</option>
                    </select>
                </div>
            </div>
            <label style="font-size: 11px; font-weight: 900; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; padding-left: 4px;">Pilih Operator</label>
            <div id="productList" class="product-list">
                <div class="status-text-mini">Memuat operator...</div>
            </div>
            <button id="btnOrder" class="btn-primary" onclick="onOrderButtonClicked()" disabled>PESAN NOMOR BARU</button>
        </div>
    </div>

    <div id="serviceModal" class="modal hidden">
        <div class="modal-content" style="max-height: 85vh; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h3 class="modal-title">Pilih Layanan</h3>
                <button onclick="closeServiceModal()" class="btn-danger" style="width: 32px; height: 32px; padding: 0; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: #333;"><i class="fas fa-times"></i></button>
            </div>
            <div style="margin-bottom: 10px;">
                <input type="text" id="searchServiceInput" class="form-input" placeholder="🔍 Cari layanan... (cth: Shopee)" oninput="filterServices()" style="border-radius: 10px; font-weight: bold;">
            </div>
            <div id="serviceListContainer" style="overflow-y: auto; flex: 1; padding-right: 5px; text-align: left; display: flex; flex-direction: column;">
                <div class="status-text-mini">Memuat layanan...</div>
            </div>
        </div>
    </div>

    <div id="iframeNoteModal" class="modal hidden">
        <div class="modal-content" style="max-height: 95vh; display: flex; flex-direction: column; padding: 10px; width: 95%; max-width: 450px;">
            <div class="modal-header" style="margin-bottom: 10px; padding-bottom: 5px; border-bottom: none;">
                <h3 class="modal-title" style="font-size: 16px;">Catatan</h3>
                <button onclick="closeIframeNoteModal()" class="btn-danger" style="width: 32px; height: 32px; padding: 0; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;"><i class="fas fa-times"></i></button>
            </div>
            <div style="flex: 1; border-radius: 12px; overflow: hidden; background: #fff;">
                <iframe src="https://shopee-smscode.github.io/Notes/notes.html" style="width: 100%; height: 100%; border: none; min-height: 65vh; display: block;"></iframe>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">⚙️ Pengaturan</h3>
                <button onclick="closeSettingsModal()" class="btn-danger" style="width: 32px; height: 32px; padding: 0; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: #333;"><i class="fas fa-times"></i></button>
            </div>
            <div style="text-align: left; margin-bottom: 20px;">
                <label style="font-size: 13px; font-weight: bold; color: var(--text-secondary); margin-bottom: 8px; display: block;">Masukkan API Key OTP Cepat</label>
                <input type="text" id="settingsApiKey" class="form-input" placeholder="Contoh: 69c532208d65442fadbeb...">
            </div>
            <button onclick="saveSettings()" class="btn-success" style="width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 900;"><i class="fas fa-save"></i> SIMPAN PENGATURAN</button>
        </div>
    </div>

    <div id="historyModal" class="modal hidden">
        <div class="modal-content" style="max-height: 85vh; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h3 class="modal-title">Riwayat Pesanan</h3>
                <button onclick="closeHistoryModal()" class="btn-danger" style="width: 32px; height: 32px; padding: 0; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: #333;"><i class="fas fa-times"></i></button>
            </div>
            <div id="history-list" style="overflow-y: auto; flex: 1; padding-right: 5px; text-align: left; display: flex; flex-direction: column; gap: 8px;">
                <div class="status-text-mini" style="text-align:center;">Belum ada riwayat lokal.</div>
            </div>
            <button onclick="clearHistory()" class="btn-danger" style="margin-top: 15px; width: 100%; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: bold;"><i class="fas fa-trash"></i> Bersihkan Riwayat</button>
        </div>
    </div>

    <div id="toast" class="toast">Notifikasi!</div>

    <script>
        function toggleAppDropdown() {
            var menu = document.getElementById("menuDropdown");
            if (menu && menu.classList.contains('show')) menu.classList.remove('show');
            document.getElementById("appDropdown").classList.toggle("show");
        }
        function toggleMenuDropdown() {
            var app = document.getElementById("appDropdown");
            if (app && app.classList.contains('show')) app.classList.remove('show');
            document.getElementById("menuDropdown").classList.toggle("show");
        }
        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn') && !event.target.closest('.dropbtn') && 
                !event.target.matches('.dropbtn-icon') && !event.target.closest('.dropbtn-icon')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) openDropdown.classList.remove('show');
                }
            }
        }
        function openIframeNoteModal() { document.getElementById('iframeNoteModal').classList.remove('hidden'); }
        function closeIframeNoteModal() { document.getElementById('iframeNoteModal').classList.add('hidden'); }
    </script>
    <script src="otpcepat.js"></script>
</body>
</html>
